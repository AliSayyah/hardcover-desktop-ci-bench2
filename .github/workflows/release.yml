name: Release

# Push a tag such as v0.2.0 to publish a GitHub release. Before tagging, bump
# the version in crates/app/Cargo.toml and add a <release> to the metainfo.
# Run it by hand to build the tarball as a workflow artifact without releasing.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: Build x86_64 tarball
    runs-on: ubuntu-24.04
    # Building on the oldest supported Ubuntu keeps the glibc floor at 2.35.
    container: ubuntu:22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the version matches the tag
        if: github.ref_type == 'tag'
        run: ci/check-version.sh "$GITHUB_REF_NAME"

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: dist

      - run: cargo build --profile dist --locked -p hardcover-desktop

      - name: Package
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/app/Cargo.toml | head -n1)
          packaging/linux/package.sh "$version" target/dist/hardcover-desktop dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      # Signing happens here, not in the build job: the build runs every
      # dependency's build script, and none of them should see the key.
      - name: Install minisign
        env:
          MINISIGN_VERSION: "0.12"
          MINISIGN_SHA256: 9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73
        run: |
          cd "$RUNNER_TEMP"
          archive="minisign-$MINISIGN_VERSION-linux.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSfLO \
            "https://github.com/jedisct1/minisign/releases/download/$MINISIGN_VERSION/$archive"
          echo "$MINISIGN_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" minisign-linux/x86_64/minisign 2>/dev/null
          echo "$RUNNER_TEMP/minisign-linux/x86_64" >>"$GITHUB_PATH"

      - name: Sign the tarball
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          key="$RUNNER_TEMP/minisign.key"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$MINISIGN_SECRET_KEY" >"$key")
          for tarball in dist/*.tar.gz; do
            minisign -S -s "$key" -m "$tarball"
          done

      - name: Verify the signatures with the app's public key
        run: |
          for tarball in dist/*.tar.gz; do
            minisign -V -p packaging/minisign.pub -m "$tarball"
          done

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Changes first, then the install instructions. The app shows the
          # notes up to the marker.
          {
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$TAG" --jq .body
            printf '\n\n<!-- install -->\n'
            cat packaging/linux/release-notes.md
          } >"$RUNNER_TEMP/notes.md"
          prerelease=()
          if [[ $TAG == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Hardcover Desktop ${TAG#v}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "${prerelease[@]}"

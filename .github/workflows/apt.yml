name: apt-debug
on:
  push:
    branches: ["debug-*"]
jobs:
  apt:
    strategy:
      fail-fast: false
      matrix:
        mirror: [default, azure, azure-ipv4]
        n: [1, 2]
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    defaults:
      run:
        shell: bash
    steps:
      - run: cat /etc/apt/sources.list | grep -v '^#' | grep . | head -3; cat /etc/resolv.conf
      - if: matrix.mirror != 'default'
        run: sed -i -E 's#http://(archive|security)\.ubuntu\.com/ubuntu/?#http://azure.archive.ubuntu.com/ubuntu/#' /etc/apt/sources.list
      - if: matrix.mirror == 'azure-ipv4'
        run: echo 'Acquire::ForceIPv4 "true";' > /etc/apt/apt.conf.d/99ipv4
      - run: time apt-get update
      - run: time apt-get install -y --no-install-recommends --download-only build-essential ca-certificates curl git pkg-config libdbus-1-dev libfontconfig-dev libxcb1-dev libxkbcommon-x11-dev 2>&1 | tail -5
      - run: time env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends build-essential ca-certificates curl git pkg-config libdbus-1-dev libfontconfig-dev libxcb1-dev libxkbcommon-x11-dev >/dev/null
